[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoservice-ai"
version = "1.0.0"
description = "AutoService AI — локальная система управления мультибрендовым автосервисом"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "PySide6-Pdf==6.12.0.140",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "openpyxl==3.1.5",
    "reportlab==5.1.0",
    "pypdf==7.0.0",
    "pillow==13.0.0",
    "cryptography==50.0.2",
]

[project.scripts]
autoservice-ai = "autoservice.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoservice = [
    "data/*.json",
    "assets/*",
    "persistence/migrations/*.py",
    "persistence/migrations/*.mako",
    "persistence/migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
